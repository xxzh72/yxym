name: Update best-domain List

on:
  schedule:
    - cron: '0 */12 * * *' # 真正每12小时运行一次（如果需要每3小时请改回 '0 */3 * * *'）
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write
  
jobs:
  update-ip-list:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      run: python ${{ github.workspace }}/best-domain.py

    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Action"

        echo "Checking for changes..."
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "Changes detected, committing..."
          # ⭐ 核心修复：把 ip.txt 改为你的实际输出文件 best-domain.txt
          git add best-domain.txt
          git commit -m "Automatic update best-domain.txt"
          git push origin HEAD:${{ github.ref }}
        else
          echo "No changes detected, skipping commit."
        fi
