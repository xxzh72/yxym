name: Update PROXYIP List

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# ✅ 并发锁：同一时间只跑一个
concurrency:
  group: update-proxyip
  cancel-in-progress: true

jobs:
  update-ip-list:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # ⭐ 必须：否则 rebase 可能失败

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run script
      run: python collect_proxyip.py

    - name: Commit and push safely
      run: |
        set -e

        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Action"

        BRANCH="auto/proxyip-update"

        echo "Checking for changes..."
        if [[ -z "$(git status --porcelain)" ]]; then
          echo "No changes detected, exiting."
          exit 0
        fi

        echo "Changes detected, committing..."
        git add proxyip.txt
        git commit -m "Automatic update ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"

        # ✅ 切换到独立分支（避免污染 main）
        git checkout -B $BRANCH

        # ✅ 拉取远程最新（rebase）
        git pull --rebase origin main || true

        # ✅ push + retry 机制
        for i in {1..5}; do
          echo "Push attempt $i..."

          if git push origin $BRANCH; then
            echo "Push succeeded"
            break
          else
            echo "Push failed, retrying..."
            git pull --rebase origin main || true
            sleep 2
          fi
        done

    - name: Create or update PR
      uses: peter-evans/create-pull-request@v6
      with:
        branch: auto/proxyip-update
        base: main
        title: "Auto update proxy IP list"
        body: |
          This PR was automatically generated by GitHub Actions.
        commit-message: "Automatic update"
